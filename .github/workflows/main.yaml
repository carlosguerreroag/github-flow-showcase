name: CICD Pipeline

# to-do: testing phases, 
# initsql from s3
# on dockerfile: healthchecks, restart policies

on:
  push:
    branches: [ "main" ]
    paths:
      - 'app/**'
      - 'docker/**'
  pull_request:
    branches: [ "main" ]
    paths:
      - 'app/**'
      - 'docker/**'
  workflow_dispatch:

jobs:
  set-tags:
    runs-on: ubuntu-latest
    outputs:
      TAG: ${{ steps.set_tag.outputs.TAG }}
    steps:
      - name: Set tags
        id: set_tag
        run: |
          DATE=$(date +%Y%m%d%H%M%S)
          SHA=${GITHUB_SHA::7}
          TAG="${DATE}-${SHA}-staging"
          echo "TAG=$TAG" >> $GITHUB_ENV
          echo "::set-output name=TAG::$TAG"

  build:
    runs-on: ubuntu-latest
    needs: set-tags
    steps:
      - name: Checkout repo
        uses: actions/checkout@v3

      - name: Set up Docker Build
        uses: docker/setup-buildx-action@v2

      - name: Build Docker imgs
        run: |
          docker build -f docker/Dockerfile -t app01:${{ needs.set-tags.outputs.TAG }} .

      - name: Save Docker images
        run: |
          docker save app01:${{ needs.set-tags.outputs.TAG }} -o build_artifact.tar
      
      - name: Upload build artifact 
        uses: actions/upload-artifact@v4
        with:
          name: build-artifact 
          path: |
            build_artifact.tar
#
