#      uses: actions/download-artifact@v4
#      with:
#        name: build-artifact 
#        path: .
#    
#    - name: Load Docker imgs 
#      run: |
#        docker load -i build_artifact.tar
#
#    - name: Run python tests
#      run: |
#        docker run --rm ${{ env.DOCKERHUB_ORG_NAME }}/users:${{ needs.set-tags.outputs.TAG }} pytest
#
  publish:
    runs-on: ubuntu-latest
    needs: [set-tags, build]
    steps:
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v1
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ vars.AWS_REGION }} 

      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v1

      - name: Download build artifact 
        uses: actions/download-artifact@v4
        with:
          name: build-artifact 
          path: .

      - name: Load Docker image
        run: |
          docker load -i build_artifact.tar

      - name: Tag and Publish imgs
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          ECR_REPO: ${{ secrets.ECR_REPO_NAME }}
        run: |
          docker tag app01:${{ needs.set-tags.outputs.TAG }} ${{ steps.login-ecr.outputs.registry }}/${{ secrets.ECR_REPO_NAME }}:${{ needs.set-tags.outputs.TAG }}
          docker push $ECR_REGISTRY/$ECR_REPO:${{ needs.set-tags.outputs.TAG }}

  deploy:
    runs-on: ubuntu-latest
    needs: [set-tags, build, publish]
    steps:
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v1
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ vars.AWS_REGION }} 

      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v1

      - name: Checkout repo
        uses: actions/checkout@v3

      - name: Append app01 img name on .env file
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          ECR_REPO: ${{ secrets.ECR_REPO_NAME }}
        run: |
          APP01_IMAGE_NAME=$ECR_REGISTRY/$ECR_REPO:${{ needs.set-tags.outputs.TAG }}
          echo "APP01_IMAGE_NAME=$APP01_IMAGE_NAME" >> ./docker/.env

      - name: Check if the db is initialized 
        id: initsql_check
        uses: appleboy/ssh-action@v1
        env:
          STACK_NAME: ${{ vars.DOCKER_STACK_NAME }}
        with:
          host: ${{ secrets.INSTANCE_IP }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_PRIVATE_KEY }}
          port: ${{ secrets.SSH_PORT }}
          capture_stdout: true
          envs: STACK_NAME 
          script: |
            DB_CONTAINER=$(docker ps --filter label=com.docker.swarm.service.name="$STACK_NAME"_db --format '{{.ID}}')
            
            if [ -z "$DB_CONTAINER" ]; then
              echo "false"
            elif docker exec "$DB_CONTAINER" test -f /var/lib/postgresql/data/PG_VERSION; then
              echo "true"
            else
              echo "false"
            fi

      - name: Copy init.sql to instance if the db is not initialized
        if: contains(steps.initsql_check.outputs.stdout, 'false')
        uses: appleboy/scp-action@v1
        with:
          host: ${{ secrets.INSTANCE_IP }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_PRIVATE_KEY }}
          port: ${{ secrets.SSH_PORT }}
          source: ./docker/init.sql 
          target: /tmp/
          strip_components: 2 

      - name: Ensure Swarm and the env is configured 
        uses: appleboy/ssh-action@v1
        env:
          APP_POSTGRES_CREDS: ${{ secrets.APP_POSTGRES_CREDS }}
          APP_SESSION_SECRET_KEY: ${{ secrets.APP_SESSION_SECRET_KEY }}
        with:
          host: ${{ secrets.INSTANCE_IP }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_PRIVATE_KEY }}
          port: ${{ secrets.SSH_PORT }}
          envs: APP_POSTGRES_CREDS,APP_SESSION_SECRET_KEY
          script: |
            # Ensure Docker Swarm is initialized
            if [ "$(docker info --format '{{.Swarm.LocalNodeState}}')" = "inactive" ]; then
              docker swarm init
            fi

            # Create secrets if they don't exist
            if [ -n "$APP_SESSION_SECRET_KEY" ] && ! docker secret inspect session-secret-key >/dev/null 2>&1; then
              printf "$APP_SESSION_SECRET_KEY" | docker secret create session-secret-key -
            fi
            
            if [ -n "$APP_POSTGRES_CREDS" ] && ! docker secret inspect postgres-creds >/dev/null 2>&1; then
              printf "$APP_POSTGRES_CREDS" | docker secret create postgres-creds -
            fi

      - name: Pull image from ECR
        uses: appleboy/ssh-action@v1
        env:
          ECR_REPO_NAME: ${{ secrets.ECR_REPO_NAME }}
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          AWS_REGION: ${{ vars.AWS_REGION }}  
          IMG_TAG: ${{ needs.set-tags.outputs.TAG }}
        with:
          host: ${{ secrets.INSTANCE_IP }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_PRIVATE_KEY }}
          port: ${{ secrets.SSH_PORT }}
          envs: ECR_REPO_NAME,ECR_REGISTRY,AWS_ACCESS_KEY_ID,AWS_SECRET_ACCESS_KEY,AWS_REGION,IMG_TAG
          script: |
            echo "Logging in to AWS ECR..." 
            aws ecr get-login-password --region "$AWS_REGION" | docker login --username AWS --password-stdin "$ECR_REGISTRY"
            docker pull "$ECR_REGISTRY/$ECR_REPO_NAME":"$IMG_TAG"

      - name: Docker Stack Deploy
        uses: cssnr/stack-deploy-action@v1
        with:
          name: ${{ vars.DOCKER_STACK_NAME }} 
          file: ./docker/docker-stack.yaml
          host: ${{ secrets.INSTANCE_IP }}
          user: ${{ secrets.DEPLOY_USER }} 
          ssh_key: ${{ secrets.DEPLOY_SSH_PRIVATE_KEY }}
          env_file: ./docker/.env
          args: --remove-orphans
          prune: true

      - name: Cleanup 
        uses: appleboy/ssh-action@v1
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
        with:
          host: ${{ secrets.INSTANCE_IP }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_PRIVATE_KEY }}
          port: ${{ secrets.SSH_PORT }}
          envs: ECR_REGISTRY
          script: |
            # Cleanup init.sql script from the system if present
            if [ -e "/tmp/init.sql" ]; then
              rm /tmp/init.sql
            fi
            echo "Waiting for the stack update to finish..."
            sleep 15
            echo "Cleaning unused containers and imgs..."
            docker container prune -f
            docker image prune -af
            echo "Logging out of ECR..."
            docker logout "$ECR_REGISTRY"
