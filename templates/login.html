<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Login Demo</title>
    <style>
        body { font-family: Arial; display: flex; justify-content: center; margin-top: 10%; background: #f4f4f4; }
        .login-box { background: white; padding: 2rem; border-radius: 8px; box-shadow: 0 4px 6px rgba(0,0,0,0.1); text-align: center; }
        input { display: block; width: 100%; margin-bottom: 1rem; padding: 0.5rem; box-sizing: border-box; }
        button { background: #007BFF; color: white; border: none; padding: 0.5rem 1rem; width: 100%; border-radius: 4px; cursor: pointer; }
        .error { color: red; font-size: 0.9em; margin-bottom: 1rem; }
    </style>
</head>
<body>
    <div class="login-box">
        <h2>Sign In</h2>
        {% with messages = get_flashed_messages() %}
          {% if messages %}
            <div class="error">{{ messages[0] }}</div>
          {% endif %}
        {% endwith %}
        <form method="POST">
            <input type="text" name="username" placeholder="User" required>
            <input type="password" name="password" placeholder="Pass" required>
            <button type="submit">Entrar</button>
        </form>
        <p style="font-size: 0.8em; color: gray;">Try: <b>demo</b> / <b>1234</b></p>
    </div>
</body>
</html>
